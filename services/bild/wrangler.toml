name = "jeffa-bild"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "../../dist/bild"

[vars]
CF_ACCOUNT_ID = "debefed4a9b9645537c7bf00563358a0"
AI_GATEWAY_ID = "jeffa-gateway"
DEFAULT_MODEL = "gemini-3.5-flash-lite"
HISTORY_LIMIT = "6"
CACHE_TTL = "3600"
MAX_OUTPUT_TOKENS = "1024"
SUMMARY_EVERY = "8"
BUDGET_DAILY_USD = "1"
BUDGET_GLOBAL_DAILY_USD = "3"
RATE_LIMIT_PER_MIN = "30"
FALLBACK_MODEL = "google/gemini-2.5-flash-lite"

[[d1_databases]]
binding = "DB"
database_name = "jeffa-kollab"
database_id = "e95913ea-7749-4a56-9580-5610f3cd9acd"

[[kv_namespaces]]
binding = "KV"
id = "0ec191e5f5b148d391d46d63d51f42a2"
